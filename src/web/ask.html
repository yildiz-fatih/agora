<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Agora</title>
</head>

<body class="has-navbar-fixed-top">
    <nav class="navbar is-fixed-top is-dark" role="navigation" aria-label="main navigation">
        <div class="container">
            <div class="navbar-brand">
                <a class="navbar-item has-text-weight-bold is-size-4" href="index.html">agora</a>
            </div>
            <div class="navbar-menu">
                <div class="navbar-start">
                    <div class="navbar-item">
                        <form action="search.html" method="GET">
                            <input class="input" type="text" name="q" id="search-input" placeholder="Search…"
                                autocomplete="off">
                        </form>
                    </div>
                </div>
                <div class="navbar-end">
                    <div class="navbar-item">
                        <div id="navbar-auth-guest">
                            <button type="button" class="button is-link" id="login-btn">Login or Sign Up</button>
                        </div>
                        <div id="navbar-auth-user" class="buttons is-hidden">
                            <span class="navbar-item has-text-weight-semibold" id="navbar-username"></span>
                            <button type="button" class="button is-light" id="logout-btn">Log out</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </nav>

    <div class="container is-max-desktop mt-5">
        <div class="column">
            <h1 class="title is-4 mb-4">Ask a Question</h1>

            <form id="ask-form">
                <div class="field">
                    <label class="label">Title</label>
                    <div class="control">
                        <input class="input" type="text" id="ask-title" required>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Body</label>
                    <div class="control">
                        <textarea class="textarea" id="ask-body" rows="8" required></textarea>
                    </div>
                </div>

                <div class="field">
                    <label class="label">Tags</label>
                    <div class="control">
                        <input class="input" type="text" id="ask-tags" placeholder="comma, separated, tags">
                    </div>
                    <p class="help">Optional, separate with commas.</p>
                </div>

                <p class="has-text-danger is-hidden mb-4" id="ask-error"></p>

                <div class="field">
                    <div class="control">
                        <button type="submit" class="button is-link" id="ask-submit">Post Your Question</button>
                    </div>
                </div>
            </form>
        </div>
    </div>

    <script type="module" src="/src/ask.ts"></script>
</body>

</html>
