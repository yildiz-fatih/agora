events {}

http {
    server {
        listen 80;

        location /questions {
            proxy_pass http://questionsvc:8080;
        }

        location /search {
            proxy_pass http://searchsvc:8080;
        }

        location /profiles {
            proxy_pass http://profilesvc:8080;
        }
        
        location /votes {
            proxy_pass http://votesvc:8080;
        }
    }
}