name: agora

services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.7.0
    command: start-dev --import-realm
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
    ports:
      - "8080:8080"
    volumes:
      - keycloak-data:/opt/keycloak/data
      - ./infra/keycloak/import:/opt/keycloak/data/import
    restart: unless-stopped

  postgres:
    image: postgres:18.4-trixie
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  meilisearch:
    image: getmeili/meilisearch:v1.50.0
    environment:
      MEILI_MASTER_KEY: ${MEILI_KEY}
      MEILI_ENV: "development"
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "7700:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:7700/health" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4.3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  questionsvc:
    build:
      context: src/services/QuestionSvc
      additional_contexts:
        contracts: src/shared/Contracts
    env_file:
      - src/services/QuestionSvc/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "7001:8080"
    restart: unless-stopped
  
  searchsvc:
    build:
      context: src/services/SearchSvc
      additional_contexts:
        contracts: src/shared/Contracts
    env_file:
      - src/services/SearchSvc/.env
    depends_on:
      rabbitmq:
        condition: service_healthy
      meilisearch:
        condition: service_healthy
    ports:
      - "7002:8080"
    restart: unless-stopped

  gateway:
    image: nginx:1.31-trixie
    ports:
      - "8000:80"
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - questionsvc
      - searchsvc
      - profilesvc
      - votesvc
    restart: unless-stopped
  
  profilesvc:
    build:
      context: src/services/ProfileSvc
    env_file:
      - src/services/ProfileSvc/.env
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "7003:8080"
    restart: unless-stopped
    
  votesvc:
    build:
      context: src/services/VoteSvc
      additional_contexts:
        contracts: src/shared/Contracts
    env_file:
      - src/services/VoteSvc/.env
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "7004:8080"
    restart: unless-stopped

volumes:
  keycloak-data:
  postgres-data:
  meili-data:
  rabbitmq-data:
